# Merge into the host configuration source. Never copy outside secrets or JDBC settings here.
# Add inside to the host's existing profiles; do not replace its dev/FAT/production profiles.
# Set through the host's profile/bootstrap mechanism rather than copying spring.profiles.active.
planning.host.enabled=true
planning.manual.enabled=true
planning.business-config.enabled=true
planning.config-release.enabled=true
planning.auto-schedule.enabled=true
planning.tasks.enabled=true
planning.history.mode=business_only
planning.source.enabled=true
planning.api-prefix=/api/plan
planning.source.api-prefix=/api/plan/internal/source
planning.python.base-url=${BANK_PLANNING_PYTHON_URL}
planning.python.token=${BANK_PLANNING_PYTHON_TOKEN}
planning.source.token=${BANK_PLANNING_SOURCE_TOKEN}
planning.legacy.enabled=false
planning.local-pulse.enabled=false
planning.manual.initialize-schema=false
