<svg xmlns="http://www.w3.org/2000/svg" width="920" height="342" viewBox="0 0 920 342" role="img"><title>生产时间、流水与内容状态</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#98A2B3"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#FFF"/><g font-family="Microsoft YaHei, sans-serif"><text fill="#101828" font-size="20" text-anchor="middle"><tspan x="460" y="30">生产时间、流水与内容状态</tspan></text><polyline points="290,97 330,97" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="590,97 630,97" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="760,132 760,172" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text fill="#667085" font-size="12" text-anchor="middle"><tspan x="768" y="144">是</tspan></text><polyline points="630,207 590,207" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="330,207 290,207" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="62" width="260" height="70" rx="18" fill="#F3EFFF" stroke="#C8BAFF" stroke-width="1.3"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="160" y="102">定题完成并保持待生产</tspan></text><rect x="330" y="62" width="260" height="70" rx="8" fill="#F8FAFC" stroke="#D6DCE5" stroke-width="1.3"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="460" y="102">宿主每天触发3次扫描</tspan></text><path d="M760 58L890 97L760 136L630 97Z" fill="#FFF8EB" stroke="#D9B66F" stroke-width="1.4"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="760" y="102">已到投放日期减x天？</tspan></text><rect x="630" y="172" width="260" height="70" rx="8" fill="#F8FAFC" stroke="#D6DCE5" stroke-width="1.3"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="760" y="212">Java写入现成内容流水</tspan></text><rect x="330" y="172" width="260" height="70" rx="8" fill="#F8FAFC" stroke="#D6DCE5" stroke-width="1.3"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="460" y="212">内容侧生产→生产中</tspan></text><rect x="30" y="172" width="260" height="70" rx="18" fill="#F3EFFF" stroke="#C8BAFF" stroke-width="1.3"/><text fill="#344054" font-size="16" text-anchor="middle"><tspan x="160" y="212">真实事实→完成／失败</tspan></text><rect x="30" y="277" width="860" height="46" rx="8" fill="#FFF8EB" stroke="#ECD9AC"/><text fill="#805B14" font-size="14" text-anchor="middle"><tspan x="460" y="306">未到期、未配置或未定题先等待；写入不等于生产，不重复写</tspan></text></g></svg>